{% extends "base.html" %}
{% block title %}Check in with LIMA{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:10px auto">
  <h1>Check in with LIMA</h1>
  <p>LIMA is a robot peer mentor. Before you start, it will tell you what it keeps and who can read it.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="name">What should LIMA call you?</label>
    <input type="text" id="name" name="name" required maxlength="60" autocomplete="off">
    <label for="iu_username">IU username (optional, helps LIMA remember you)</label>
    <input type="text" id="iu_username" name="iu_username" maxlength="40" autocomplete="off">
    <label for="flow">Check-in</label>
    <select id="flow" name="flow">{% for f in flows %}<option value="{{ f.id }}">{{ f.title }}</option>{% endfor %}</select>
    <label>How would you like to talk?</label>
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <label style="color:inherit"><input type="radio" name="mode" value="talk" checked> Talk out loud</label>
      <label style="color:inherit"><input type="radio" name="mode" value="type"> Type here</label>
      <label style="color:inherit"><input type="checkbox" name="muted" value="1"> Mute LIMA's voice (text only)</label>
    </div>
    <label for="rate">LIMA's speaking speed: <output id="rate_out">1.0</output>x</label>
    <input type="range" id="rate" name="rate" min="0.6" max="1.6" step="0.05" value="1.0" oninput="rate_out.value=this.value">
    <p><button>Start check-in</button></p>
  </form>
  <p class="muted">Peer Mentors and staff: <a href="{{ url_for('login') }}">log in</a></p>
</div>
{% endblock %}
