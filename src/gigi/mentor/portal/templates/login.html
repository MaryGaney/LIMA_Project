{% extends "base.html" %}
{% block title %}LIMA staff login{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h1>Peer Mentor &amp; staff login</h1>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="username">Username</label><input type="text" id="username" name="username" autocomplete="username" required autofocus>
    <label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required>
    <p><button>Log in</button></p>
  </form>
  <p class="muted">Prototype accounts are local to this robot. A real deployment should use IU single sign-on.</p>
  <p class="muted">Student? <a href="{{ url_for('kiosk_start') }}">Start a check-in</a></p>
</div>
{% endblock %}
